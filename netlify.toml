# Site index files, served by netlify/functions/site-index.mjs. These rules
# must stay above the single-page-app fallback below, or the paths would
# answer with index.html.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/site-index?file=sitemap"
  status = 200

[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/site-index?file=llms"
  status = 200

[[redirects]]
  from = "/llms-full.txt"
  to = "/.netlify/functions/site-index?file=llms-full"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
